plugins { id 'com.android.library'; id 'maven-publish' }
android {
    namespace 'dev.cubiclib.ftc'
    compileSdk 34
    defaultConfig { minSdk 24; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    publishing { singleVariant('release') { withSourcesJar() } }
    sourceSets { debug.java.srcDir '../examples' }
}
dependencies {
    api project(':cubic-core')
    compileOnly 'org.firstinspires.ftc:RobotCore:12.0.0'
    compileOnly 'org.firstinspires.ftc:Hardware:12.0.0'
    compileOnly 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
afterEvaluate {
    publishing { publications { release(MavenPublication) { from components.release; artifactId = 'cubic-ftc' } } }
}
